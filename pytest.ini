[pytest]
pythonpath = .
testpaths = tests
# Each session sees only its own red. Lab 3's tests ship from day one so the
# repo never changes shape mid-course, but a Session 1 student running `pytest`
# must see seven failures - their spec - not thirty. Session 3 turns them on
# with `pytest -m lab3`; a command-line -m overrides this one.
addopts = -m "not live and not lab3"
markers =
    live: makes a real network call and needs an API key (run with -m live)
    lab3: Session 3 work, hidden until then (run with -m lab3)
